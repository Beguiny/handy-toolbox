plugins {
    id 'java-library'
    // ModDevGradle for Forge 1.20.1 (remaps the jar to SRG names)
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared (JEI)'
                url = uri('https://maven.blamejared.com')
            }
        }
        filter { includeGroup('mezz.jei') }
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    runs {
        configureEach {
            systemProperty('mixin.env.remapRefMap', 'true')
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

mixin {
    config("${mod_id}.mixins.json")
}

dependencies {
    // compile against the JEI API; the full JEI is only used in the dev environment
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
}

def expandProps = [
        mod_id               : mod_id,
        mod_name             : mod_name,
        mod_version          : mod_version,
        mod_author           : mod_author,
        mod_license          : mod_license,
        mod_description      : mod_description,
        minecraft_version_range: minecraft_version_range,
        forge_version_range  : forge_version_range,
        loader_version_range : loader_version_range,
]

processResources {
    inputs.properties(expandProps)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta', '*.mixins.json']) {
        expand(expandProps)
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${mod_id}" }
    }
    manifest.attributes([
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : mod_author,
            'Implementation-Title'  : mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor' : mod_author,
            'MixinConfigs'          : "${mod_id}.mixins.json",
    ])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
